name: Check the reading experience

on:
  push:
    branches: [main, 'ownership/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan the publishable tree for credentials
        run: |
          curl -fL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir "$GITHUB_WORKSPACE" --redact --no-banner

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://readagain_test:integration-only@127.0.0.1:55432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:56379/0
      TEST_APP_URL: http://127.0.0.1:58000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - name: Unit regressions
        run: python -m pytest apps/api/tests -q
      - name: Seed an upload volume owned by the previous container user
        run: >-
          docker compose -p readagain-verification -f compose.integration.yml --profile app
          run --build --rm --no-deps --user 0:0 api python -c
          "from pathlib import Path; import os; p = Path('/app/storage');
          (p / 'legacy-fixture.txt').write_text('retained fixture'); os.chown(p, 0, 0); os.chmod(p, 0o755)"
      - name: Start isolated app, queue, and database
        run: docker compose -p readagain-verification -f compose.integration.yml --profile app up --build -d --wait
      - name: Verify that existing uploads remain readable and writable
        run: |
          docker compose -p readagain-verification -f compose.integration.yml exec -T api python - <<'PY'
          import os
          from pathlib import Path
          p = Path('/app/storage')
          assert os.getuid() == 1001
          assert (p / 'legacy-fixture.txt').read_text() == 'retained fixture'
          assert (p / 'legacy-fixture.txt').stat().st_uid == 1001
          (p / 'write-probe.txt').write_text('writable')
          (p / 'write-probe.txt').unlink()
          PY
      - name: Real database and upload-to-discussion checks
        working-directory: apps/api
        run: python -m pytest integration -q
      - name: Packaged ChatGPT connection against the offline provider
        run: >-
          docker compose -p readagain-verification -f compose.integration.yml
          exec -T api python - < apps/api/integration/check_chatgpt_package.py
      - name: Show service failures
        if: failure()
        run: docker compose -p readagain-verification -f compose.integration.yml logs --tail 100
      - name: Remove test containers and fixture uploads
        if: always()
        run: docker compose -p readagain-verification -f compose.integration.yml --profile app down -v

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:stream
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile reader regressions
        env:
          READING_TEST_URL: http://127.0.0.1:3100
        run: |
          node node_modules/next/dist/bin/next start -p 3100 > "$RUNNER_TEMP/reader-server.log" 2>&1 &
          reader_pid=$!
          trap 'kill "$reader_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3100
          READING_SCREENSHOTS="$RUNNER_TEMP/reading-previews" npm run test:reader

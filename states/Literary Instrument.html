<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LLM Book Club — Literary Instrument</title>
<link rel="stylesheet" href="styles.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="states/dusk.jsx"></script>
<script type="text/babel" src="states/shelf.jsx"></script>
<script type="text/babel" src="states/threshold.jsx"></script>
<script type="text/babel" src="states/spread.jsx"></script>
<script type="text/babel" src="states/lab.jsx"></script>
<script type="text/babel" src="states/constellation.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const STATES = ['dusk','shelf','threshold','spread','lab','after-dark','constellation'];
const STATE_LABELS = {
  'dusk': '01 · dusk',
  'shelf': '02 · shelf',
  'threshold': '03 · threshold',
  'spread': '04 · spread',
  'lab': '05 · lab',
  'after-dark': '06 · after dark',
  'constellation': '07 · constellation',
};
const HOSTILE = {
  'dusk':          { q: 'What if it’s the user’s first visit?', a: 'The whisper-strip is silent; the book is closed; "Step in" reads "Begin."' },
  'shelf':         { q: 'What if BOOKS_DIR is empty?', a: 'Empty shelf appears as a planed bare board with a quiet drop-zone; the room is patient.' },
  'threshold':     { q: 'What if the user picks style:sexy but isn’t 18+?', a: 'The door is visible but unmoving. Server-side gate; no amount of client clicking opens it.' },
  'spread':        { q: 'What if the book has no chapter structure?', a: 'The slice falls back to char-range with a generated anchor phrase. The margins still speak to the page, not the chapter.' },
  'lab':           { q: 'What if the user interrupts mid-aura?', a: 'Aura dims on tap; turn is suspended, not killed. Agents hold their next sentence in a translucent footnote until you resume.' },
  'after-dark':    { q: 'How is this not just a palette swap?', a: 'Spring damping increases, line-height tightens, type metrics shift, aura attack slows 2.2×. The room has different physics.' },
  'constellation': { q: 'What if the user has read one book, once?', a: 'One bright star at center; three faint motif nodes orbiting. The sky is sparse on purpose — it grows.' },
};

const STATE_ORDER = ['dusk','shelf','threshold','spread','lab','after-dark','constellation'];

const App = () => {
  const initial = localStorage.getItem('lbc_state') || 'dusk';
  const [state, setState]       = useState(initial);
  const [book, setBook]         = useState(null);
  const [afterDark, setAfterDark] = useState(false);
  const [showLab, setShowLab]   = useState(false);
  const [cursorMode, setCursorMode] = useState('reader');
  const [turning, setTurning]   = useState(null); // 'fwd' | 'rev' | null

  // Tweak state — persisted defaults
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "skin": "footnote",
    "density": "novice",
    "reduceMotion": false
  }/*EDITMODE-END*/;
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => { localStorage.setItem('lbc_state', state); }, [state]);

  // trigger a page-turn between states; auto-clears
  const goState = (next) => {
    if (next === state) return;
    if (tweaks.reduceMotion) { setState(next); return; }
    const dir = STATE_ORDER.indexOf(next) >= STATE_ORDER.indexOf(state) ? 'fwd' : 'rev';
    setTurning(dir);
    // swap the state mid-turn so the new spread is revealed under the closing leaf
    setTimeout(() => setState(next), 420);
    setTimeout(() => setTurning(null), 1120);
  };

  // Tweaks protocol: register listener first, then announce
  useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const worldCls = [
    'world',
    afterDark ? 'after-dark' : '',
    'cursor-' + cursorMode,
    tweaks.reduceMotion ? 'reduce-motion' : '',
  ].join(' ');

  return (
    <div className={worldCls} data-screen-label={STATE_LABELS[state]}>
      <div className="room-backdrop"/>

      {/* The atelier — state nav */}
      <div className="atelier">
        {STATES.map(s => (
          <button key={s}
            className={state === s ? 'active' : ''}
            onClick={() => {
              if (s === 'lab')             { setShowLab(true);  goState('lab'); }
              else if (s === 'after-dark') { setAfterDark(true); setShowLab(false); goState('after-dark'); }
              else if (s === 'spread')     { setAfterDark(false); setShowLab(false); goState('spread'); }
              else                         { setShowLab(false); goState(s); }
            }}
          >{STATE_LABELS[s]}</button>
        ))}
      </div>

      {/* Page-turn overlay */}
      {turning && (
        <div className="page-turn-overlay">
          <div className={`page-turn-shadow ${turning === 'rev' ? 'reverse' : ''}`}/>
          <div className={`page-turn-leaf ${turning === 'rev' ? 'reverse' : ''}`}/>
        </div>
      )}

      {/* Stage */}
      {state === 'dusk'       && <Dusk onEnter={() => goState('shelf')}/>}
      {state === 'shelf'      && <Shelf onPick={(b) => { setBook(b); goState('threshold'); }}/>}
      {state === 'threshold'  && (
        <Threshold
          book={book || SHELF_BOOKS[0]}
          setAfterDark={setAfterDark}
          onEnter={() => goState('spread')}
        />
      )}
      {(state === 'spread' || state === 'lab' || state === 'after-dark') && (
        <Spread
          afterDark={afterDark || state === 'after-dark'}
          skin={tweaks.skin}
          density={tweaks.density}
        />
      )}
      {state === 'constellation' && <Constellation/>}

      {/* LAB slides over SPREAD */}
      {showLab && (state === 'spread' || state === 'lab') && (
        <Lab onClose={() => { setShowLab(false); goState('spread'); }}
             cursorMode={cursorMode}
             setCursorMode={setCursorMode}/>
      )}

      {/* Hostile question footnote */}
      <div className="hostile-note">
        <div style={{ color: 'rgba(245,235,210,0.35)', marginBottom: 4 }}>hostile question</div>
        <div className="q">? {HOSTILE[state]?.q}</div>
        <div style={{ marginTop: 4 }}>→ {HOSTILE[state]?.a}</div>
      </div>

      {/* Tweaks */}
      {tweaksOpen && (
        <div className="tweaks">
          <h4>tweaks</h4>
          <div className="tweak-row">
            <label>book skin</label>
            <div className="options">
              {['footnote','noir','poetry'].map(s => (
                <button key={s} className={tweaks.skin===s?'on':''} onClick={() => setTweak('skin', s)}>{s}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label>reader</label>
            <div className="options">
              {['novice','expert'].map(s => (
                <button key={s} className={tweaks.density===s?'on':''} onClick={() => setTweak('density', s)}>{s}</button>
              ))}
            </div>
          </div>
          <div className="tweak-row">
            <label>prefers-reduced-motion</label>
            <div className="options">
              <button className={!tweaks.reduceMotion?'on':''} onClick={() => setTweak('reduceMotion', false)}>full</button>
              <button className={tweaks.reduceMotion?'on':''} onClick={() => setTweak('reduceMotion', true)}>reduced</button>
            </div>
          </div>
          <div className="tweak-row">
            <label>after-dark</label>
            <div className="options">
              <button className={!afterDark?'on':''} onClick={() => setAfterDark(false)}>standard</button>
              <button className={afterDark?'on':''} onClick={() => setAfterDark(true)}>after-dark</button>
            </div>
          </div>
          <div style={{
            fontFamily: 'Literata, serif', fontStyle: 'italic',
            fontSize: 11, lineHeight: 1.55,
            color: 'rgba(245,235,210,0.45)',
            marginTop: 14, paddingTop: 14,
            borderTop: '1px solid rgba(255,255,255,0.08)',
          }}>
            The book skins the room. Noir gets colder paper and sharper serifs;
            poetry gets airier line-height.
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

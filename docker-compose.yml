services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bookclub
      POSTGRES_PASSWORD: bookclub
      POSTGRES_DB: bookclub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookclub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./apps/api
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-false}
    command: python -m app.db.init_db
    environment:
      - DATABASE_URL=postgresql+psycopg://bookclub:bookclub@db:5432/bookclub
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-false}
    environment:
      - DATABASE_URL=postgresql+psycopg://bookclub:bookclub@db:5432/bookclub
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_LLM_BASE_URL=http://ollama:11434/v1
      - LOCAL_EMBEDDINGS_BASE_URL=http://ollama:11434/v1
      - BOOKS_DIR=/books
    env_file:
      - ./apps/api/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - book_storage:/app/storage
      - ${BOOKS_DIR:-./books}:/books:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: ./apps/api
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-false}
    command: python run_worker.py
    environment:
      - DATABASE_URL=postgresql+psycopg://bookclub:bookclub@db:5432/bookclub
      - REDIS_URL=redis://redis:6379/0
      - LOCAL_LLM_BASE_URL=http://ollama:11434/v1
      - LOCAL_EMBEDDINGS_BASE_URL=http://ollama:11434/v1
      - BOOKS_DIR=/books
    env_file:
      - ./apps/api/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - book_storage:/app/storage
      - ${BOOKS_DIR:-./books}:/books:ro

  web:
    build:
      context: ./apps/web
    env_file:
      - ./apps/web/.env.local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # VibeVoice Realtime TTS (OpenAI-compatible)
  # Start with: docker compose --profile gpu up
  vibevoice:
    profiles: ["gpu"]
    build:
      context: ./vibevoice
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - ./vibevoice/models:/home/ubuntu/app/models
    environment:
      - CFG_SCALE=1.25
      - OPTIMIZE_FOR_SPEED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Ollama for open-source LLM support
  # Start with: docker compose --profile local up
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db_data:
  book_storage:
  ollama_data:
